name = "edge-voice-agent-holds-call"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[[actors]]
binding = "VOICE_AGENT"
type = "VoiceAgent"

[telnyx]
binding = "TELNYX"

[[secrets]]
binding = "TELNYX_API_KEY"
